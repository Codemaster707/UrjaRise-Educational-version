<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UrjaRise | Auth</title>
    <!-- Preconnect to external CDNs for reduced connection latency -->
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    
    <!-- Preload key image assets -->
    <link rel="preload" as="image" href="PyLearn.png">

    <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Background glow elements -->
    <div class="background-glow top-left"></div>
    <div class="background-glow bottom-right"></div>
    <div class="background-glow center-burst"></div>
    
    <div class="container">
        <div class="logo-section">
            <div class="logo-icon">
                <i class="fa-solid fa-fire-flame-curved"></i>
            </div>
            <h1>UrjaRise</h1>
        </div>

        <!-- Circular brand image header -->
        <div class="brand-banner">
            <img src="PyLearn.png" alt="Pi Learn Logo" width="80" height="80">
        </div>

        <div class="auth-card">
            <div class="tabs">
                <button class="tab active" id="tab-signin">Sign In</button>
                <button class="tab" id="tab-signup">Sign Up</button>
            </div>

            <div class="social-login">
                <button type="button" class="google-btn">
                    <img src="https://fonts.gstatic.com/s/i/productlogos/googleg/v6/24px.svg" alt="Google" width="20" height="20">
                    <span>Continue with Google</span>
                </button>
            </div>

            <div class="divider">
                <span>OR</span>
            </div>

            <form id="auth-form">
                <div class="input-group">
                    <i class="fa-regular fa-envelope"></i>
                    <input type="email" id="email" placeholder="Email address" required autocomplete="email">
                </div>

                <div class="input-group">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" placeholder="Password" required autocomplete="current-password">
                    <i class="fa-regular fa-eye toggle-password"></i>
                </div>

                <a href="#" class="forgot-link">Forgot password?</a>

                <button type="submit" class="submit-btn">
                    <i class="fa-solid fa-fire"></i> <span id="submit-text">Sign In</span>
                </button>
            </form>

            <p class="footer-text">New here? <a href="#" id="switch-link">Sign Up</a></p>
        </div>

        <p class="terms">By continuing, you agree to our <strong>Terms</strong> and <strong>Privacy</strong>.</p>
    </div>

   <script type="module" src="auth.js"></script>
</body>
</html>
